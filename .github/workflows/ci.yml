name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore AlunosTech.NewSistem.slnx
      - run: dotnet build AlunosTech.NewSistem.slnx --no-restore -c Release
      - run: dotnet test AlunosTech.NewSistem.slnx --no-build -c Release

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Definir imagem
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/alunostech-newsistem" >> "$GITHUB_ENV"
      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

  validar-k8s:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Renderizar e validar manifests
        run: |
          kubectl kustomize k8s > /tmp/alunostech-k8s.yaml
          docker run --rm -v /tmp/alunostech-k8s.yaml:/work/manifests.yaml ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /work/manifests.yaml
          docker run --rm -v "$GITHUB_WORKSPACE/k8s/secret.example.yaml:/work/secret.example.yaml" ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary /work/secret.example.yaml

  deploy:
    if: false
    needs: [docker, validar-k8s]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      # Desativado até existir um cluster real e KUBE_CONFIG estar configurado nos secrets.
      - name: Configurar cluster
        run: echo '${{ secrets.KUBE_CONFIG }}' | base64 -d > "$HOME/.kube/config"
      - run: kubectl apply -k k8s/
