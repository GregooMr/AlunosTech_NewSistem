services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}"
    # Para administração local, descomente a porta e use localhost,1433.
    # ports:
    #   - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "/database/init-db.sh"]
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD no arquivo .env}"
    volumes:
      - ./database/AlunosTech_Moderno.sql:/database/AlunosTech_Moderno.sql:ro
      - ./database/init-db.sh:/database/init-db.sh:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AlunosTech_Moderno;User Id=app_user;Password=${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD no arquivo .env};TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  sqlserver_data:
