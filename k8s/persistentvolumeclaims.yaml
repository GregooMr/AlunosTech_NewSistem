apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alunostech-uploads
  namespace: alunostech
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alunostech-data-protection
  namespace: alunostech
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi