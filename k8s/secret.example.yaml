# Exemplo somente com placeholders. Não aplique este arquivo nem grave valores reais aqui.
apiVersion: v1
kind: Secret
metadata:
  name: alunostech-secrets
  namespace: alunostech
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AlunosTech_Moderno;User Id=app_user;Password=__APP_DB_PASSWORD__;TrustServerCertificate=True;"
  MSSQL_SA_PASSWORD: "__MSSQL_SA_PASSWORD__"
  APP_DB_PASSWORD: "__APP_DB_PASSWORD__"
---
apiVersion: v1
kind: Secret
metadata:
  name: alunostech-tls
  namespace: alunostech
type: kubernetes.io/tls
stringData:
  tls.crt: "__CERTIFICADO_TLS__"
  tls.key: "__CHAVE_TLS__"
